<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store | TCG Pro</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./index.html">TCG Pro</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./store.html" aria-current="page">Store</a>
          <a href="./about.html">About</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-banner">
        <div class="container">
          <h1>Store</h1>
          <p>Sealed Pokémon, Magic: The Gathering, and One Piece products.</p>
        </div>
      </section>

      <section class="container section">
        <!-- Product cards are rendered into this container by src/main.js -->
        <div id="product-grid" class="product-grid" aria-live="polite"></div>

        <!-- Pagination controls are wired up by src/main.js -->
        <nav class="pagination" id="pagination" aria-label="Product pages">
          <button type="button" id="prev-btn" class="page-btn" disabled>
            &larr; Previous
          </button>
          <div id="page-numbers" class="page-numbers"></div>
          <button type="button" id="next-btn" class="page-btn">
            Next &rarr;
          </button>
        </nav>
        <p id="page-status" class="page-status"></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 TCG Pro. All rights reserved.</p>
        <div class="footer-hours">
          <strong>Store Hours</strong>
          <p>Mon&ndash;Fri 10am&ndash;8pm &middot; Sat 10am&ndash;6pm &middot; Sun 12pm&ndash;5pm</p>
        </div>
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
